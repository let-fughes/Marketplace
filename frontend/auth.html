<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и Регистрация | ShopService</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .soft-glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.03); }
        .input-field { background-color: #1e293b; transition: all 0.2s; border: 1px solid transparent; }
        .input-field:focus { background-color: #334155; border-color: rgba(96, 165, 250, 0.3); outline: none; }
        .input-error { border-color: rgba(239, 68, 68, 0.5) !important; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); cursor: pointer; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div id="form-container" class="w-full max-w-md p-8 md:p-10 rounded-3xl soft-glass shadow-2xl text-slate-200 transition-all duration-500">
        
        <div class="text-center mb-10">
            <h1 id="form-title" class="text-3xl font-semibold tracking-tight text-white">Welcome Back!</h1>
            <p id="form-subtitle" class="text-slate-400 mt-2 text-sm text-balance">Login into your account</p>
        </div>

        <form id="auth-form" class="space-y-5">
            <div id="fields-grid" class="grid grid-cols-1 gap-4">
                
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1 ml-1">Login</label>
                    <input type="text" name="login" required placeholder="username" 
                           class="w-full p-4 rounded-2xl input-field text-white text-sm">
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1 ml-1">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••" 
                           class="w-full p-4 rounded-2xl input-field text-white text-sm">
                </div>

                <div class="reg-only hidden">
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1 ml-1">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" 
                           class="w-full p-4 rounded-2xl input-field text-white text-sm">
                </div>

                <div class="reg-only hidden">
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1 ml-1">First Name</label>
                    <input type="text" name="firstName" placeholder="John" 
                           class="w-full p-4 rounded-2xl input-field text-white text-sm">
                </div>

                <div class="reg-only hidden">
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1 ml-1">Last Name</label>
                    <input type="text" name="lastName" placeholder="Doe" 
                           class="w-full p-4 rounded-2xl input-field text-white text-sm">
                </div>

                <div class="reg-only hidden">
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1 ml-1">Email</label>
                    <input type="email" name="email" placeholder="email@example.com" 
                           class="w-full p-4 rounded-2xl input-field text-white text-sm">
                </div>

                <div class="reg-only hidden">
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1 ml-1">Phone</label>
                    <input type="tel" name="phoneNumber" placeholder="+375..." 
                           class="w-full p-4 rounded-2xl input-field text-white text-sm">
                </div>

                <div class="reg-only hidden">
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1 ml-1">Birth Date</label>
                    <input type="date" name="birthDate" 
                           class="w-full p-4 rounded-2xl input-field text-white text-sm">
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full py-4 mt-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl transition-all shadow-lg shadow-blue-900/20 active:scale-95">
                Login
            </button>
        </form>

        <div class="mt-8 text-center border-t border-white/5 pt-6">
            <p class="text-slate-400 text-sm">
                <span id="toggle-text">Don't have an account?</span>
                <button id="toggle-btn" class="text-blue-400 hover:text-blue-300 font-medium ml-1 transition-colors">
                    Sign Up
                </button>
            </p>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://127.0.0.1:8080/v1/api/auth'; 

        const container = document.getElementById('form-container');
        const toggleBtn = document.getElementById('toggle-btn');
        const submitBtn = document.getElementById('submit-btn');
        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');
        const toggleText = document.getElementById('toggle-text');
        const regOnlyFields = document.querySelectorAll('.reg-only');
        const authForm = document.getElementById('auth-form');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');

        let isLogin = true;

        toggleBtn.addEventListener('click', () => {
            isLogin = !isLogin;
            container.style.opacity = '0';
            
            setTimeout(() => {
                if (isLogin) {
                    container.classList.replace('max-w-2xl', 'max-w-md');
                    formTitle.innerText = 'Welcome Back!';
                    formSubtitle.innerText = 'Login into your account';
                    submitBtn.innerText = 'Login';
                    toggleText.innerText = "Don't have an account?";
                    toggleBtn.innerText = 'Sign Up';
                    regOnlyFields.forEach(f => {
                        f.classList.add('hidden');
                        f.querySelector('input')?.removeAttribute('required');
                    });
                } else {
                    container.classList.replace('max-w-md', 'max-w-2xl');
                    formTitle.innerText = 'Create Account';
                    formSubtitle.innerText = 'Fill in the fields, please';
                    submitBtn.innerText = 'Register';
                    toggleText.innerText = 'Already have an account?';
                    toggleBtn.innerText = 'Login';
                    regOnlyFields.forEach(f => {
                        f.classList.remove('hidden');
                        // Не ставим required на birthDate и phone, если они опциональны в DTO
                    });
                }
                container.style.opacity = '1';
            }, 250);
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(authForm);
            const data = Object.fromEntries(formData.entries());

            let payload = {
                login: data.login,
                password: data.password
            };

            if (!isLogin) {
                if (data.password !== confirmInput.value) {
                    confirmInput.classList.add('input-error');
                    alert("Passwords do not match!");
                    return;
                }
                // Добавляем поля для RegisterRequest
                payload = {
                    ...payload,
                    firstName: data.firstName || null,
                    lastName: data.lastName || null,
                    email: data.email || null,
                    phoneNumber: data.phoneNumber || null,
                    birthDate: data.birthDate || null
                };
            }

            const endpoint = isLogin ? '/login' : '/register';
            submitBtn.disabled = true;
            submitBtn.innerText = 'Sending...';

            try {
                const response = await fetch(`${BASE_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok) {
                    if (isLogin) {
                        // Сохраняем токены из TokenResponse
                        localStorage.setItem('accessToken', result.accessToken);
                        localStorage.setItem('refreshToken', result.refreshToken);
                        window.location.href = 'index.html'; 
                    } else {
                        alert(result.message || 'Registration successful! Please login.');
                        toggleBtn.click();
                    }
                } else {
                    alert(`Error: ${result.message || 'Action failed'}`);
                }
            } catch (error) {
                alert('Backend is unreachable. Check CORS or Server status.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = isLogin ? 'Login' : 'Register';
            }
        });
    </script>
</body>
</html>
