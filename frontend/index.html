<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | BARAHOLISHE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .soft-glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.03); }
        .search-field { background-color: #1e293b; transition: all 0.2s ease; }
        .search-field:focus { background-color: #334155; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        .category-item { transition: all 0.2s ease; cursor: pointer; border: 1px solid transparent; }
        .category-item:hover { background-color: rgba(59, 130, 246, 0.1); color: #60a5fa; }
        .category-active { background-color: rgba(59, 130, 246, 0.15); color: #60a5fa; border-color: rgba(59, 130, 246, 0.3); }
        .product-card { background: #1e293b; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        
        #user-avatar {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .loading-shimmer {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="min-h-screen">

    <header class="sticky top-0 z-50 w-full px-6 py-4 soft-glass border-b border-white/5">
        <div class="max-w-[1600px] mx-auto flex items-center justify-between gap-8">
            
            <div class="flex-shrink-0 cursor-pointer" onclick="window.location.href='index.html'">
                <span class="text-2xl font-bold tracking-tighter bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent uppercase">
                    BARAHOLISHE
                </span>
            </div>

            <div class="flex-grow max-w-2xl relative">
                <input type="text" id="search-input" placeholder="Search for items..." 
                       class="w-full pl-12 pr-4 py-3 rounded-2xl search-field outline-none text-white placeholder-slate-500 text-sm">
                <svg class="absolute left-4 top-3.5 w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>

            <div class="flex items-center gap-6">

                <a href="favorites.html" class="group relative p-2 text-slate-400 hover:text-red-400 transition-colors" title="Favorites">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                    </svg>
                    <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-blue-500 rounded-full border-2 border-[#0f172a] opacity-0 group-hover:opacity-100 transition-opacity"></span>
                </a>

                <a href="CreateAd.html" class="hidden md:block text-sm font-semibold text-blue-400 hover:text-blue-300 transition-colors uppercase tracking-wider">
                    + Post Ad
                </a>
                
                <div id="user-block" class="flex items-center gap-3 p-1.5 pl-4 rounded-full bg-slate-800/80 border border-white/5">
                    <div class="text-right hidden sm:block">
                        <p id="user-role-label" class="text-[10px] font-bold text-slate-500 uppercase tracking-tighter">Guest</p>
                        <p id="user-name-label" class="text-xs font-semibold text-white leading-tight">Sign In</p>
                    </div>
                    <a href="profile.html" id="user-avatar" class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center font-bold shadow-lg hover:scale-105 transition-transform text-white">
                        ?
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-[1600px] mx-auto px-6 py-10 flex gap-10">
        
        <aside class="w-64 flex-shrink-0 hidden lg:block">
            <h3 class="text-[10px] font-bold uppercase tracking-[0.25em] text-slate-500 mb-6 ml-2">Categories</h3>
            <nav class="space-y-1" id="category-nav">
                <div class="px-4 py-3 rounded-xl category-item text-sm font-medium text-slate-400 category-active" data-cat="ALL">All Categories</div>
                <div class="px-4 py-3 rounded-xl category-item text-sm font-medium text-slate-400" data-cat="ELECTRONICS">Electronics</div>
                <div class="px-4 py-3 rounded-xl category-item text-sm font-medium text-slate-400" data-cat="HOME">Home & Garden</div>
                <div class="px-4 py-3 rounded-xl category-item text-sm font-medium text-slate-400" data-cat="AUTO">Auto & Parts</div>
                <div class="px-4 py-3 rounded-xl category-item text-sm font-medium text-slate-400" data-cat="FASHION">Fashion</div>
                <div class="px-4 py-3 rounded-xl category-item text-sm font-medium text-slate-400" data-cat="SPORT">Sport</div>
            </nav>
        </aside>

        <section class="flex-grow">
            <div class="flex justify-between items-end mb-8">
                <h2 id="section-title" class="text-2xl font-semibold text-white tracking-tight">Recent Ads</h2>
            </div>
            <div id="items-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-6">
            </div>
        </section>
    </main>

    <script>
        const GATEWAY_URL = 'http://localhost:8080';
        const ITEMS_API = `${GATEWAY_URL}/v1/api/items`;
        const USER_API = `${GATEWAY_URL}/v1/api/users/profile`;

        async function initAuth() {
            const token = localStorage.getItem('accessToken');
            if (!token) {
                document.getElementById('user-avatar').href = 'auth.html';
                return;
            }

            try {
                const response = await fetch(USER_API, {
                    method: 'GET',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    const user = await response.json();
                    const nameLabel = document.getElementById('user-name-label');
                    const roleLabel = document.getElementById('user-role-label');
                    const avatarCircle = document.getElementById('user-avatar');

                    nameLabel.textContent = `${user.firstName} ${user.lastName ? user.lastName[0] + '.' : ''}`;
                    roleLabel.textContent = user.role || 'User';
                    
                    if (user.role === 'ADMIN') {
                        roleLabel.classList.replace('text-slate-500', 'text-amber-400');
                    }

                    if (user.profilePhotoUrl) {
                        avatarCircle.textContent = '';
                        avatarCircle.style.backgroundImage = `url('${user.profilePhotoUrl}')`;
                        avatarCircle.classList.remove('bg-slate-700');
                    } else {
                        avatarCircle.textContent = user.firstName ? user.firstName[0].toUpperCase() : '?';
                        avatarCircle.classList.add('bg-gradient-to-tr', 'from-blue-600', 'to-indigo-400');
                        avatarCircle.style.backgroundImage = 'none';
                    }

                    avatarCircle.href = 'profile.html';
                } else {
                    localStorage.removeItem('accessToken');
                    document.getElementById('user-avatar').href = 'auth.html';
                }
            } catch (err) {
                console.error("Auth init failed", err);
            }
        }

        async function loadItems(category = 'ALL') {
            const grid = document.getElementById('items-grid');
            
            grid.innerHTML = Array(8).fill(0).map(() => `
                <div class="product-card rounded-[2.5rem] h-80 loading-shimmer opacity-20 border border-white/5"></div>
            `).join('');

            try {
                let url = ITEMS_API;
                if (category !== 'ALL') {
                    url += `/getByCategory/${category}`; 
                }

                const response = await fetch(url);
                if (!response.ok) throw new Error("Load failed");
                const items = await response.json();
                renderItems(items);
            } catch (err) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-20">Unable to load ads. Check backend connection.</p>`;
            }
        }

        async function renderItems(items) {
            const grid = document.getElementById('items-grid');
            if (!items || items.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-20">No items in this category yet.</p>`;
                return;
            }

            const cards = await Promise.all(items.map(async item => {
                let imgUrl = "https://via.placeholder.com/400x300?text=No+Image";
                try {
                    const imgRes = await fetch(`${ITEMS_API}/getImage/${item.id}`);
                    if (imgRes.ok) {
                        const imgData = await imgRes.json();
                        if (imgData.url) imgUrl = imgData.url;
                    }
                } catch (e) {}

                return `
                    <div onclick="window.location.href='ProductView.html?id=${item.id}'"
                         class="product-card rounded-[2.5rem] overflow-hidden flex flex-col cursor-pointer border border-white/5 group">
                        <div class="h-52 bg-slate-800/30 relative overflow-hidden">
                            <img src="${imgUrl}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                            <div class="absolute top-4 left-4 px-3 py-1 bg-slate-900/60 backdrop-blur-md rounded-full text-[9px] font-bold text-blue-400 uppercase tracking-widest border border-white/10">
                                ${item.category || 'Other'}
                            </div>
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <h4 class="text-slate-200 font-semibold mb-2 line-clamp-1 group-hover:text-blue-400 transition-colors">
                                ${item.name}
                            </h4>
                            <div class="flex items-center justify-between mt-auto pt-4 border-t border-white/5">
                                <p class="text-lg font-bold text-white">
                                    ${new Intl.NumberFormat('be-BY').format(item.price)} 
                                    <span class="text-xs text-blue-400 ml-1">BYN</span>
                                </p>
                            </div>
                        </div>
                    </div>
                `;
            }));
            grid.innerHTML = cards.join('');
        }

        document.querySelectorAll('.category-item').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-item').forEach(b => b.classList.remove('category-active'));
                btn.classList.add('category-active');
                
                const cat = btn.getAttribute('data-cat');
                document.getElementById('section-title').textContent = (cat === 'ALL') ? 'Recent Ads' : btn.textContent;
                
                loadItems(cat);
            });
        });

        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.product-card');
            cards.forEach(card => {
                const title = card.querySelector('h4').textContent.toLowerCase();
                card.style.display = title.includes(query) ? 'flex' : 'none';
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            initAuth();
            loadItems();
        });
    </script>
</body>
</html>
