<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites | WEB SHOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .soft-glass {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .product-card {
            background: #1e293b;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12">

    <div class="max-w-[1400px] mx-auto">
        
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-12">
            <div>
                <a href="index.html" class="text-blue-400 hover:text-blue-300 text-sm font-medium flex items-center mb-4 transition-colors">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back to Marketplace
                </a>
                <h1 class="text-3xl font-bold text-white tracking-tight">Saved Items</h1>
                <p class="text-slate-400 mt-1">You have <span id="items-count" class="text-blue-400 font-semibold">0</span> items in your wishlist</p>
            </div>
            
            <button onclick="clearAllFavorites()" class="px-6 py-3 bg-slate-800 hover:bg-red-500/10 hover:text-red-400 text-slate-300 rounded-2xl text-sm font-medium transition-all border border-white/5">
                Clear All Favorites
            </button>
        </header>

        <div id="empty-state" class="hidden py-20 text-center">
            <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-10 h-10 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
            </div>
            <h3 class="text-xl font-medium text-white">Your list is empty</h3>
            <p class="text-slate-500 mt-2 mb-8">Start exploring and save items you like!</p>
            <a href="index.html" class="px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-medium transition-all">Browse Items</a>
        </div>

        <div id="favorites-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        </div>

        <footer class="mt-20 pt-8 border-t border-white/5 text-center text-[10px] text-slate-600 uppercase tracking-widest">
            WEB SHOP Favorites Engine &bull; 2026
        </footer>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/v1/api/items';
        const USER_ID = 1;

        const grid = document.getElementById('favorites-grid');
        const emptyState = document.getElementById('empty-state');
        const counter = document.getElementById('items-count');

        document.addEventListener('DOMContentLoaded', loadFavorites);

        async function loadFavorites() {
            try {
                const response = await fetch(`${API_BASE_URL}/getFavorites/${USER_ID}`);
                if (!response.ok) throw new Error('Failed to fetch favorites');
                
                const favorites = await response.json();

                if (!favorites || favorites.length === 0) {
                    showEmptyState();
                    return;
                }

                await renderFavorites(favorites);
            } catch (error) {
                console.error('Error:', error);
                showEmptyState();
            }
        }

        async function renderFavorites(favorites) {
            grid.innerHTML = '';
            counter.textContent = favorites.length;
            emptyState.classList.add('hidden');

            const itemPromises = favorites.map(fav => 
                fetch(`${API_BASE_URL}/${fav.itemId}`).then(res => res.json())
            );

            const items = await Promise.all(itemPromises);

            items.forEach(item => {
                const cardHtml = `
                    <div class="product-card rounded-[2rem] overflow-hidden flex flex-col relative group" id="item-card-${item.id}">
                        <button onclick="removeFromFavorites(${item.id})" title="Remove" 
                                class="absolute top-4 right-4 z-10 p-2 bg-white/10 backdrop-blur-md rounded-xl text-white hover:bg-red-500 transition-all opacity-0 group-hover:opacity-100">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>

                        <div class="h-48 bg-slate-800 flex items-center justify-center overflow-hidden">
                            ${item.imageUrl 
                                ? `<img src="${item.imageUrl}" alt="${item.name}" class="w-full h-full object-cover">`
                                : `<span class="text-slate-600 italic text-sm">No image</span>`
                            }
                        </div>
                        
                        <div class="p-6">
                            <div class="mb-2">
                                <span class="text-[10px] font-bold text-blue-400 uppercase tracking-widest">
                                    ${item.category || 'General'}
                                </span>
                            </div>
                            <h4 class="text-slate-200 font-medium mb-4 line-clamp-1">${item.name}</h4>
                            <p class="text-xl font-bold text-white mb-6">${item.price.toFixed(2)} BYN</p>
                            
                            <a href="checkout.html?itemId=${item.id}" 
                               class="block w-full py-3 bg-slate-700 hover:bg-blue-600 text-white text-center rounded-xl text-sm font-medium transition-all active:scale-95">
                                Buy Now
                            </a>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        async function removeFromFavorites(itemId) {
            try {
                const response = await fetch(`${API_BASE_URL}/favorites`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: USER_ID, itemId: itemId })
                });

                if (response.ok) {
                    const card = document.getElementById(`item-card-${itemId}`);
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(20px)';
                    
                    setTimeout(() => {
                        loadFavorites();
                    }, 300);
                }
            } catch (error) {
                console.error('Delete failed:', error);
                alert('Connection error. Try again later.');
            }
        }

        async function clearAllFavorites() {
            if (!confirm('Are you sure you want to clear your entire wishlist?')) return;
            alert('This would call a bulk delete API in production!');
        }

        function showEmptyState() {
            grid.innerHTML = '';
            counter.textContent = '0';
            emptyState.classList.remove('hidden');
        }
    </script>

</body>
</html>
