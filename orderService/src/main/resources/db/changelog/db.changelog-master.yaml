databaseChangeLog:
  - changeSet:
      id: create-items-table
      author: Kiryl-Klimashevich
      changes:
        - createTable:
            tableName: items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(10000)
              - column:
                  name: price
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: VARCHAR(512)

  - changeSet:
      id: create-orders-table
      author: Kiryl-Klimashevich
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: creation_date
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: orders
            indexName: idx_orders_user_id
            columns:
              - column: { name: user_id }
        - createIndex:
            tableName: orders
            indexName: idx_orders_status
            columns:
              - column: { name: status }

  - changeSet:
      id: create-order-items-table
      author: Kiryl-Klimashevich
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_items_order
                    referencedTableName: orders
                    referencedColumnNames: id
              - column:
                  name: item_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_items_item
                    referencedTableName: items
                    referencedColumnNames: id
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
        - createIndex:
            tableName: order_items
            indexName: idx_order_items_order_id
            columns:
              - column: { name: order_id }

  - changeSet:
      id: create-favorites-table
      author: Kiryl-Klimashevich
      changes:
        - createTable:
            tableName: favorites
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: userId
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: itemId
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true