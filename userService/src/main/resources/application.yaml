spring:
  application:
    name: user-service

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET}
  refresh:
    expiration: 604800000
  access:
    expiration: 900000

minio:
  url: ${MINIO_URL}
  accessKey: ${MINIO_USERNAME}
  secretKey: ${MINIO_PASSWORD}

SANDLER:
  MAIL:
    USERNAME: ${MAIL_USERNAME}
    PASSWORD: ${MAIL_PASSWORD}
