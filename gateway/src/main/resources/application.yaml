server:
  port: 8080

spring:
  application:
    name: Shop Gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET}
    cloud:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
    codec:
      max-in-memory-size: 10MB
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB